<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pocket Watch Studio">
  <!-- bow (the ring a chain hooks onto) and crown -->
  <circle cx="32" cy="6.5" r="4.2" fill="none" stroke="#1f2a33" stroke-width="2.6"/>
  <rect x="28.6" y="10.4" width="6.8" height="5.2" rx="1.4" fill="#1f2a33"/>
  <!-- case -->
  <circle cx="32" cy="38" r="22.5" fill="#b8892f"/>
  <circle cx="32" cy="38" r="19" fill="#fffdf8"/>
  <!-- hour ticks -->
  <g stroke="#1f2a33" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="21.5" x2="32" y2="24.5"/>
    <line x1="48.5" y1="38" x2="45.5" y2="38"/>
    <line x1="32" y1="54.5" x2="32" y2="51.5"/>
    <line x1="15.5" y1="38" x2="18.5" y2="38"/>
  </g>
  <!-- the face is a play button -->
  <path d="M27.5 30.2 L40.6 38 L27.5 45.8 Z" fill="#1f2a33" stroke="#1f2a33" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
